version: '3.8'

services:
  # 1. Permanent Analytical Vault
  postgres:
    image: postgres:15-alpine
    container_name: ulpf-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ulpf_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. High-Throughput Buffer Broker
  kafka:
    image: apache/kafka:latest
    container_name: ulpf-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  # 3. Ingestion API Receiver
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ulpf-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/ulpf_db
    depends_on:
      - kafka
      - postgres

  # 4. Kafka Normalization Consumer Worker
  consumer:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ulpf-consumer
    restart: always
    command: ["python", "kafka_consumer.py"]
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/ulpf_db
    depends_on:
      - kafka
      - postgres
      - backend

  # 5. React Telemetry Command Center
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: ulpf-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata: